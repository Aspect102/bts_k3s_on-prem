# Register configured IPs only; this does not discover live Service allocations.
apiVersion: netbox.dev/v1
kind: IpAddress
metadata:
  name: nginx-loadbalancer
  namespace: netbox-operator
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ipAddress: "192.168.20.6/32"
  description: "Kubernetes LoadBalancer: nginx"
  preserveInNetbox: true
---
