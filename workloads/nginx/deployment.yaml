apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: python-http
          image: python:3.13-slim
          command:
            - python
            - -m
            - http.server
            - "80"
            - --bind
            - 0.0.0.0
          ports:
            - containerPort: 80
