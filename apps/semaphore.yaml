apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: semaphore
  namespace: argocd
spec:
  sources:
    - repoURL: https://semaphoreui.github.io/charts
      chart: semaphore
      targetRevision: 16.2.2
      helm:
        releaseName: semaphore
        valueFiles:
          - $values/platform/semaphore/values.yaml
    - repoURL: git@github.com:Aspect102/bts_k3s_on-prem.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:Aspect102/bts_k3s_on-prem.git
      targetRevision: main
      ref: manifests
      path: platform/semaphore/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: semaphore
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
